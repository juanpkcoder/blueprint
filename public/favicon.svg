<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>
  </defs>
  <!-- Background icon container -->
  <rect width="64" height="64" rx="14" fill="#060b18" stroke="#0070f3" stroke-width="2"/>
  
  <!-- Blueprint Pentagonal Nodes (5 Nodes for QuintoNodo) -->
  <polygon points="32,10 52,26 44,50 20,50 12,26" fill="#0070f3" fill-opacity="0.2" stroke="url(#fav-grad)" stroke-width="2"/>
  <line x1="32" y1="10" x2="32" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="52" y1="26" x2="32" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="44" y1="50" x2="32" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="20" y1="50" x2="32" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="12" y1="26" x2="32" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 1"/>
  
  <!-- Outer Node Vertices -->
  <circle cx="32" cy="10" r="3.5" fill="#00f0ff"/>
  <circle cx="52" cy="26" r="3" fill="#38bdf8"/>
  <circle cx="44" cy="50" r="3" fill="#0070f3"/>
  <circle cx="20" cy="50" r="3" fill="#0070f3"/>
  <circle cx="12" cy="26" r="3" fill="#38bdf8"/>
  
  <!-- Center Core -->
  <circle cx="32" cy="32" r="5" fill="#0a192f" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.5" fill="#00f0ff"/>
</svg>