<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Cyan to Electric Blue Gradients -->
    <linearGradient id="bp-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ISOTIPO: 5 NODOS INTERCONECTADOS (QUINTONODO & BLUEPRINT MATRIX) -->
  <g transform="translate(15, 10)">
    <!-- Blueprint architectural subtle grid -->
    <rect x="0" y="0" width="100" height="100" rx="16" fill="#071329" stroke="#1e293b" stroke-width="1" />
    <path d="M 20 0 L 20 100 M 50 0 L 50 100 M 80 0 L 80 100 M 0 20 L 100 20 M 0 50 L 100 50 M 0 80 L 100 80" stroke="#0070f3" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.4" />

    <!-- Isometric Circuit Pentagonal Frame (5 Partners / 5 Nodes) -->
    <!-- Node coordinates: Node 1 (50, 18), Node 2 (82, 42), Node 3 (70, 80), Node 4 (30, 80), Node 5 (18, 42) -->
    <polygon points="50,18 82,42 70,80 30,80 18,42" fill="#0070f3" fill-opacity="0.12" stroke="url(#bp-gradient)" stroke-width="2.5" />
    
    <!-- Inner Blueprint Lines connecting to Core (50, 52) -->
    <line x1="50" y1="18" x2="50" y2="52" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="3 2" />
    <line x1="82" y1="42" x2="50" y2="52" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="3 2" />
    <line x1="70" y1="80" x2="50" y2="52" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="3 2" />
    <line x1="30" y1="80" x2="50" y2="52" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="3 2" />
    <line x1="18" y1="42" x2="50" y2="52" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="3 2" />

    <!-- 5 Glowing Nodes (Pentagon Vertices) -->
    <circle cx="50" cy="18" r="4.5" fill="#00f0ff" filter="url(#neon-glow)" />
    <circle cx="82" cy="42" r="4" fill="#38bdf8" />
    <circle cx="70" cy="80" r="4" fill="#0070f3" />
    <circle cx="30" cy="80" r="4" fill="#0070f3" />
    <circle cx="18" cy="42" r="4" fill="#38bdf8" />

    <!-- Center Node (The Core QuintoNodo) -->
    <circle cx="50" cy="52" r="7" fill="#0a192f" stroke="#00f0ff" stroke-width="2" />
    <circle cx="50" cy="52" r="3" fill="#00f0ff" />
  </g>

  <!-- LOGOTIPO TYPOGRAPHY -->
  <g transform="translate(132, 22)">
    <!-- Main Brand Name: BLUEPRINT -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#text-gradient)" letter-spacing="2px">
      BLUEPRINT
    </text>

    <!-- Subtitle: BY QUINTONODO TECH -->
    <g transform="translate(2, 68)">
      <rect x="0" y="-14" width="180" height="20" rx="4" fill="#0c1f44" stroke="#00f0ff" stroke-width="0.8" opacity="0.9" />
      <text x="8" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#00f0ff" letter-spacing="2.2px">
        BY QUINTONODO TECH
      </text>
    </g>

    <!-- Category Tagline: IT EXPRESS & MANTENIMIENTO -->
    <text x="194" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="11.5" fill="#94a3b8" letter-spacing="1px">
      • B2B &amp; B2C IT SOLUTIONS
    </text>
  </g>
</svg>
